<script>
// Base URL for your API
const API_BASE = '';

// Debounce function
function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        const later = () => {
            clearTimeout(timeout);
            func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
    };
}

// Mock data for testing

];

// Function to search for residents by name
async function searchResidents(firstName, lastName) {
    const statusDiv = document.getElementById('searchStatus');
    const resultsDiv = document.getElementById('searchResults');
    
    if (!firstName.trim() && !lastName.trim()) {
        statusDiv.innerHTML = '';
        resultsDiv.innerHTML = '';
        return;
    }
    
    statusDiv.innerHTML = 'Searching...';
    resultsDiv.innerHTML = '';
    
    try {
        await new Promise(resolve => setTimeout(resolve, 500)); // Simulate network delay
        
        const filteredResults = mockResidents.filter(resident => {
            const firstMatch = !firstName.trim() || 
                (resident.firstName && resident.firstName.toLowerCase().includes(firstName.toLowerCase()));
            const lastMatch = !lastName.trim() || 
                (resident.lastName && resident.lastName.toLowerCase().includes(lastName.toLowerCase()));
            return firstMatch && lastMatch;
        });
        
        statusDiv.innerHTML = '';
        displaySearchResults(filteredResults, firstName, lastName);
        
    } catch (error) {
        statusDiv.innerHTML = `Error searching: ${error.message}`;
        resultsDiv.innerHTML = '';
        console.error('Search error:', error);
    }
}

// Function to display search results
function displaySearchResults(data, firstName, lastName) {
    const resultsDiv = document.getElementById('searchResults');
    
    if (!data || data.length === 0) {
        const searchTerms = [firstName, lastName].filter(name => name.trim()).join(' ');
        resultsDiv.innerHTML = `
            <div style="text-align: center; color: #666; padding: 20px;">
                <p>No residents found${searchTerms ? ` for "${searchTerms}"` : ''}.</p>
                <p>Try adjusting your search terms or check the spelling.</p>
            </div>
        `;
        return;
    }
    
    let html = `<h2>Search Results (${data.length} found)</h2>`;
    
    data.forEach((resident) => {
        html += `
            <div class="resident-card"
                 style="border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 5px; background-color: #f9f9f9;">
                
                <h3 style="margin: 0 0 8px 0; color: #333; font-size: 1.2em;">${formatName(resident)}</h3>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div><strong>Birth Date:</strong> ${formatDate(resident.birthDate)}</div>
                    <div><strong>Death Date:</strong> ${formatDate(resident.deathDate)}</div>
                    <div><strong>Section:</strong> ${resident.section || ''}</div>
                    <div><strong>Lot:</strong> ${resident.lot || ''}</div>
                </div>
            </div>
        `;
    });
    
    resultsDiv.innerHTML = html;
}

// Helper function to format resident name
function formatName(resident) {
    const parts = [];
    if (resident.firstName) parts.push(resident.firstName);
    if (resident.middleName) parts.push(resident.middleName);
    if (resident.lastName) parts.push(resident.lastName);
    if (resident.suffix) parts.push(resident.suffix);
    return parts.join(' ');
}

// Helper function to format dates
function formatDate(dateStr) {
    if (!dateStr) return '';
    try {
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-US', { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
        });
    } catch {
        return dateStr;
    }
}

// Debounced search function
const debouncedSearch = debounce((firstName, lastName) => {
    searchResidents(firstName, lastName);
}, 300);

// Event listeners
document.addEventListener('DOMContentLoaded', function() {
    const firstNameInput = document.getElementById('firstName');
    const lastNameInput = document.getElementById('lastName');
    
    firstNameInput.addEventListener('input', () => {
        debouncedSearch(firstNameInput.value, lastNameInput.value);
    });
    
    lastNameInput.addEventListener('input', () => {
        debouncedSearch(firstNameInput.value, lastNameInput.value);
    });
});

// Dropdown menu function
function myFunction() {
    document.getElementById("myDropdown").classList.toggle("show");
}

// Close dropdown when clicking outside
window.onclick = function(event) {
    if (!event.target.matches('.dropbtn')) {
        var dropdowns = document.getElementsByClassName("dropdown-content");
        for (var i = 0; i < dropdowns.length; i++) {
            var openDropdown = dropdowns[i];
            if (openDropdown.classList.contains('show')) {
                openDropdown.classList.remove('show');
            }
        }
    }
}
