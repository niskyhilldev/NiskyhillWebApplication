<script>
    // Base URL for your API
    const API_BASE = '';

    // Debounce function to limit API calls
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }

    // Function to search for residents by name
    async function searchResidents(firstName, lastName) {
        const statusDiv = document.getElementById('searchStatus');
        const resultsDiv = document.getElementById('searchResults');
        
        // Clear previous results if both fields are empty
        if (!firstName.trim() && !lastName.trim()) {
            statusDiv.innerHTML = '';
            resultsDiv.innerHTML = '';
            return;
        }
        
        // Show loading state
        statusDiv.innerHTML = 'Searching...';
        resultsDiv.innerHTML = '';
        
        try {
            // Construct query parameters
            const params = new URLSearchParams();
            if (firstName.trim()) params.append('firstName', firstName.trim());
            if (lastName.trim()) params.append('lastName', lastName.trim());
            
            // Make the API call - adjust endpoint as needed based on your backend
            const response = await fetch(`${API_BASE}/residents/search?${params.toString()}`);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            const data = await response.json();
            
            // Clear status and display results
            statusDiv.innerHTML = '';
            displaySearchResults(data, firstName, lastName);
            
        } catch (error) {
            statusDiv.innerHTML = `Error searching: ${error.message}`;
            resultsDiv.innerHTML = '';
            console.error('Search error:', error);
        }
    }

    // Function to display search results
    function displaySearchResults(data, firstName, lastName) {
        const resultsDiv = document.getElementById('searchResults');
        
        if (!data || data.length === 0) {
            const searchTerms = [firstName, lastName].filter(name => name.trim()).join(' ');
            resultsDiv.innerHTML = `
                <div style="text-align: center; color: #666; padding: 20px;">
                    <p>No residents found${searchTerms ? ` for "${searchTerms}"` : ''}.</p>
                    <p>Try adjusting your search terms or check the spelling.</p>
                </div>
            `;
            return;
        }
        
        let html = `<h2>Search Results (${data.length} found)</h2>`;
        
        data.forEach((resident, index) => {
            html += `
                <div style="border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 5px; background-color: #f9f9f9;">
                    <h3 style="margin-top: 0; color: #333;">${formatName(resident)}</h3>
                    ${formatResidentDetails(resident)}
                </div>
            `;
        });
        
        resultsDiv.innerHTML = html;
    }

    // Helper function to format resident name
    function formatName(resident) {
        const parts = [];
        if (resident.firstName) parts.push(resident.firstName);
        if (resident.middleName) parts.push(resident.middleName);
        if (resident.lastName) parts.push(resident.lastName);
        return parts.join(' ') || 'Unknown Name';
    }

    // Helper function to format resident details
    function formatResidentDetails(resident) {
        let details = '';
        
        // Add each available field
        Object.entries(resident).forEach(([key, value]) => {
            if (key !== 'firstName' && key !== 'middleName' && key !== 'lastName' && value !== null && value !== undefined && value !== '') {
                const displayKey = key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
                details += `<p><strong>${displayKey}:</strong> ${value}</p>`;
            }
        });
        
        return details || '<p><em>No additional details available</em></p>';
    }

    // Debounced search function (waits 300ms after user stops typing)
    const debouncedSearch = debounce((firstName, lastName) => {
        searchResidents(firstName, lastName);
    }, 300);

    // Event listeners for real-time search
    document.addEventListener('DOMContentLoaded', function() {
        const firstNameInput = document.getElementById('firstName');
        const lastNameInput = document.getElementById('lastName');
        
        // Add event listeners for both input and keyup events
        firstNameInput.addEventListener('input', () => {
            debouncedSearch(firstNameInput.value, lastNameInput.value);
        });
        
        lastNameInput.addEventListener('input', () => {
            debouncedSearch(firstNameInput.value, lastNameInput.value);
        });
        
        // Also listen for keyup for better responsiveness
        firstNameInput.addEventListener('keyup', () => {
            debouncedSearch(firstNameInput.value, lastNameInput.value);
        });
        
        lastNameInput.addEventListener('keyup', () => {
            debouncedSearch(firstNameInput.value, lastNameInput.value);
        });
    });

    // Dropdown menu function (assuming this exists in your existing code)
    function myFunction() {
        document.getElementById("myDropdown").classList.toggle("show");
    }

    // Close dropdown when clicking outside
    window.onclick = function(event) {
        if (!event.target.matches('.dropbtn')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    }
    </script>
