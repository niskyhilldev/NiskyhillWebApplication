<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Search</title>
    <link rel="stylesheet" href="admin.css" />
    <script type="text/javascript" src="navbar.js" defer></script>
    <script type="text/javascript" src="admin.js" defer></script>
    <link rel="icon" type="image/x-icon" href="../img/logo.jpg">
</head>
<body>
    <custom-navbar></custom-navbar>
    <h1 style="text-align:center;">Search for an Resident</h1>
    <div class="search-container">
        <label for="searchLast">Last Name:</label>
        <input type="text" id="searchResidentLast" placeholder="Search last name">
        <button onclick="performResidentSearch()">Search</button>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Middle Name</th>
                <th>Last Name</th>
                <th>Suffix</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="residentTableBody">
            <!-- Table content will be dynamically populated -->
        </tbody>
    </table>
</body>
