<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="updatepassword.css">
</head>
<body>
  <div class="login-container">
    <h2 class="loginHeaderText">Reset Password</h2>
    <form id="loginForm">
      <input type="password" id="pass1" placeholder="New Password" required>
      <input type="password" id="pass2" placeholder="New Password (Re-Type)" required>
      <button type="submit">Reset Password</button>
    </form>
    <p id="error-message" class="error"></p>
    <div class="logoContainer">
      <span class="topText"><a href="/index.html">Nisky Hill</a></span>
      <span class="bottomText"><a href="/index.html">Cemetery</a></span>
    </div>
  </div>
  <script src="updatepassword.js"></script>
</body>
</html>
