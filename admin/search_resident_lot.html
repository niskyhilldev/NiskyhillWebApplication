<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Search</title>
    <link rel="stylesheet" href="admin.css" />
    <script type="text/javascript" src="admin.js" defer></script>
    <link rel="icon" type="image/x-icon" href="../img/logo.jpg">
    <script>
        function submitForm() {
            document.getElementById("addFileForm").reset();
        }
    </script>
</head>
<body>
    <h1 style="text-align:center;">Search for an Resident</h1>
    <div class="search-container">
        <label for="searchSection">Section:</label>
        <input type="text" id="searchSection" placeholder="Search section">
        <label for="searchLot">Lot:</label>
        <input type="text" id="searchLot" placeholder="Search lot">
        <button onclick="performLotSearch()">Search</button>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Middle Name</th>
                <th>Last Name</th>
                <th>Suffix</th>
                <th>Organization</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="lotTableBody">
            <!-- Table content will be dynamically populated -->
        </tbody>
    </table>
</body>
