<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Lot</title>
    <link rel="stylesheet" href="admin.css" />
    <link rel="stylesheet" href="form.css" />
    <script type="text/javascript" src="admin.js" defer></script>
    <script type="text/javascript" src="navbar.js" defer></script>
    <link rel="icon" type="image/x-icon" href="../img/logo.jpg">
</head>
<body>
    <h1>Lots</h1>
    <h2 style="text-align:center;">Search for a Lot</h2>
    <div class="search-container">
        <label for="searchSection">Section:</label>
        <input type="text" id="searchSection" placeholder="Search section">
        <label for="searchLotPlots">Lot:</label>
        <input type="text" id="searchLot" placeholder="Search lot">
        <button onclick="performLotSearch()">Search</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>Section Name</th>
                <th>Lot Number</th>
                <th>Lot Partition</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="lotTableBody">
            <!-- Table content will be dynamically populated -->
        </tbody>
    </table>
    <h2 style="text-align:center;">Add a Lot</h2>
    <button id="showLotFormBtn">+</button>
    <div id="addLotForm" style="display: None;">
        <form id="newLotForm">            
            <label for="addLotNumber">Lot Number*:</label>
            <input type="text" id="addLotNumber" required>
            
            <label for="addLotPortion">Lot Portion*:</label>
            <input type="text" id="addLotPortion" required>
            
            <label for="sectionId">Section*:</label>
            <input type="text" id="sectionId" required>
            
            <label for="ownerFirst">Owner First Name:</label>
            <input type="text" id="ownerFirst">
            
            <label for="ownerMiddle">Owner Middle Name:</label>
            <input type="text" id="ownerMiddle">
            
            <label for="ownerLast">Owner Last Name:</label>
            <input type="text" id="ownerLast">

            <label for="ownerSuffix">Owner Suffix:</label>
            <input type="text" id="ownerSuffix">

            <label for="organization">Organization:</label>
            <input type="text" id="organization">

            <button type="submit">Add Entry</button>
        </form>
        
    </div>
    

    <h1>Residents</h1>
    <h2 style="text-align:center;">Search for an Resident</h2>
    <div class="search-container">
        <label for="searchLast">Name:</label>
        <input type="text" id="searchResidentLast" placeholder="Search last name">
        <button onclick="performResidentSearch()">Search</button>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Middle Name</th>
                <th>Last Name</th>
                <th>Burial Date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="residentTableBody">
            <!-- Table content will be dynamically populated -->
        </tbody>
    </table>

    <div class="search-container">
        <label for="searchSection">Section:</label>
        <input type="text" id="searchSection" placeholder="Search section">
        <label for="searchLot">Lot:</label>
        <input type="text" id="searchLot" placeholder="Search lot">
        <button onclick="performLotSearch()">Search</button>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Middle Name</th>
                <th>Last Name</th>
                <th>Suffix</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="lotTableBody">
            <!-- Table content will be dynamically populated -->
        </tbody>
    </table>

    <h2 style="text-align:center;">Add a Resident</h2>
    <button id="showResidentFormBtn">+</button>
    <div id="addResidentForm" style="display: none;">
        <form id="newResidentForm">
            <label for="fName">First Name*:</label>
            <input type="text" id="fName" required>
            
            <label for="mName">Middle Name:</label>
            <input type="text" id="mName">
            
            <label for="lName">Last Name*:</label>
            <input type="text" id="lName" required>

            <label for="suffix">Suffix:</label>
            <input type="text" id="suffix">
            
            <label for="resLotNum">Lot Number*:</label>
            <input type="text" id="resLotNum" required>
            
            <label for="resPortion">Lot Portion*:</label>
            <input type="text" id="resPortion" required>
            
            <label for="resCemSection">Section*:</label>
            <input type="text" id="resCemSection" required>

            <label for="dofb">Date of Birth:</label>
            <input type="date" id="dofb">
            
            <label for="dofd">Date of Death:</label>
            <input type="date" id="dofd">
            
            <label for="vesselType">Vessel:</label>
            <select id="vesselType">
                <option value="urn">Urn</option>
                <option value="casket">Casket</option>
            </select>

            <div>
                <label for="valid">Public:</label>
                <input type="checkbox" id="valid" checked>
            </div>
            
            <button type="submit">Add Entry</button>
        </form>
    </div>

    <h1>Files</h1>
    <h2 style="text-align:center;">View Files for a Lot</h2>
    <div class="search-container">
        <label for="searchSectionPlots">Section:</label>
        <input type="text" id="searchSectionPlots" placeholder="Search section">
        <label for="searchLotPlots">Lot:</label>
        <input type="text" id="searchLotPlots" placeholder="Search lot">
        <button onclick="performFileSearch()">Search</button>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Partition</th>
                <th>File</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="fileTableBody">
            <!-- Table content will be dynamically populated -->
        </tbody>
    </table>
    <h2 style="text-align:center;">Add Files</h2>
    <div id="addFileForm">
        <form id="newFileForm">                        
            <label for="fileSectionId">Section*:</label>
            <input type="text" id="fileSectionId" required>

            <label for="fileLotId">Lot*:</label>
            <input type="text" id="fileLotId" required>

            <label for="filePartition">Partition*:</label>
            <input type="text" id="filePartition" required>
            
            <label for="newFile">Files*:</label>
            <input type="file" id="newFile" onchange="handleFileUpload(event)" multiple required>
            
            <button type="submit">Add Entry</button>
        </form>
        
    </div>
</body>
