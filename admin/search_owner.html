<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Search</title>
    <link rel="stylesheet" href="admin.css" />
    <script type="text/javascript" src="navbar.js" defer></script>
    <script type="text/javascript" src="search_owner.js" defer></script>
    <link rel="icon" type="image/x-icon" href="../img/logo.jpg">
    <script>
        function submitForm() {
            document.getElementById("addFileForm").reset();
        }
    </script>
</head>
<body>
    <custom-navbar></custom-navbar>
    <h1 style="text-align:center;">Search for an Owner</h1>
    <div class="search-container">
        <label for="searchLast">Name:</label>
        <input type="text" id="searchName" placeholder="Search last name">
        <button onclick="performOwnerSearch()">Search</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Middle Name</th>
                <th>Last Name</th>
                <th>Suffix</th>
                <th>Organization</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="ownerTableBody">
            <!-- Table content will be dynamically populated -->
        </tbody>
    </table>
</body>
