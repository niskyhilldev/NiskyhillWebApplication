<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Search</title>
    <link rel="stylesheet" href="admin.css" />
    <script type="text/javascript" src="admin.js" defer></script>
    <link rel="icon" type="image/x-icon" href="../img/logo.jpg">
    <script>
        function submitForm() {
            document.getElementById("addFileForm").reset();
        }
    </script>
</head>
<body>
    <div class="navbar">
        <div class="dropdown">
            <button>Owners</button>
            <div class="dropdown-content">
                <a href="add_owner.html">Add Owner</a>
                <a href="search_owner.html">Search Owner</a>
            </div>
        </div>

        <div class="dropdown">
            <button>Residents</button>
            <div class="dropdown-content">
                <a href="add_resident.html">Add Resident</a>
                <a href="search_resident_name.html">Search Resident by Name</a>
                <a href="search_resident_lot.html">Search Resident by Lot</a>
            </div>
        </div>

        <div class="dropdown">
            <button>Lots</button>
            <div class="dropdown-content">
                <a href="add_lot.html">Add Lot</a>
                <a href="search_lot.html">Search Lot</a>
            </div>
        </div>

        <div class="dropdown">
            <button>Sections</button>
            <div class="dropdown-content">
                <a href="add_section.html">Add Section</a>
                <a href="edit_section.html">Edit Section</a>
            </div>
        </div>

        <div class="dropdown">
            <button>Files</button>
            <div class="dropdown-content">
                <a href="add_file.html">Add File</a>
                <a href="view_files_lot.html">View Files for Lot</a>
            </div>
        </div>
    </div>
    <h1 style="text-align:center;">Search for an Owner</h1>
    <div class="search-container">
        <label for="searchLast">Last Name:</label>
        <input type="text" id="searchLast" placeholder="Search last name">
        <label for="searchOrg">Organization:</label>
        <input type="text" id="searchOrg" placeholder="Search organization">
        <button onclick="performOwnerSearch()">Search</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Middle Name</th>
                <th>Last Name</th>
                <th>Suffix</th>
                <th>Organization</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="ownerTableBody">
            <!-- Table content will be dynamically populated -->
        </tbody>
    </table>
</body>
