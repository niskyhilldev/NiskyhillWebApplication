<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Section</title>
    <link rel="stylesheet" href="admin.css" />
    <link rel="stylesheet" href="form.css" />
    <script type="text/javascript" src="admin.js" defer></script>
    <link rel="icon" type="image/x-icon" href="../img/logo.jpg">
    <script>
        function submitForm() {
            document.getElementById("newSectionForm").reset();
        }
    </script>
</head>
<body>
    <h1 style="text-align:center;">Add a Section</h1>
    <div id="addSectionForm">
        <form id="newSectionForm">                        
            <label for="addSectionId">Section:</label>
            <input type="text" id="addSectionId">
            
            <label for="internmentRecord">Section Map:</label>
            <input type="file" id="internmentRecord" onchange="handleFileUpload(event)">
            
            <button type="submit" onclick="submitForm()">Add Entry</button>
        </form>
    </div>
</body>
