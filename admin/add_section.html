<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Section</title>
    <link rel="stylesheet" href="admin.css" />
    <script type="text/javascript" src="navbar.js" defer></script>
    <link rel="stylesheet" href="form.css" />
    <script type="text/javascript" src="add_section.js" defer></script>
    <link rel="icon" type="image/x-icon" href="../img/logo.jpg">
</head>
<body>
    <custom-navbar></custom-navbar>
    <h1 style="text-align:center;">Add a Section</h1>
    <div id="addSectionForm">
        <form id="newSectionForm">                        
            <label for="addSectionId">Section*:</label>
            <input type="text" id="addSectionId" required>
            
            <label for="internmentRecord">Section Map:</label>
            <input type="file" id="internmentRecord" onchange="handleFileUpload(event)">
            
            <button type="submit">Add Entry</button>
        </form>
    </div>
</body>
