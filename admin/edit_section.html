<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Sections</title>
    <link rel="stylesheet" href="admin.css" />
    <script type="text/javascript" src="admin.js" defer></script>
    <link rel="icon" type="image/x-icon" href="../img/logo.jpg">
    <script>
        function submitForm() {
            document.getElementById("addFileForm").reset();
        }
    </script>
</head>
<body>
    <h1 style="text-align:center;">Edit a Section</h1>
    <div id="sectionEditor">
        <table>
            <thead>
                <tr>
                    <th>Section Name</th>
                    <th>Section Map</th>
                </tr>
            </thead>
            <tbody id="sectionTableBody">
                <tr>
                    <td>A</td>
                    <td>No file available</td>
                </tr>
                <tr>
                    <td>B</td>
                    <td>No file available</td>
                </tr>
                <tr>
                    <td>C</td>
                    <td>No file available</td>
                </tr>
            </tbody>
        </table>
        <button onclick="showEditor()">Edit Sections</button>
        <button onclick="saveSections()">Save Changes</button>
    </div>
</body>
