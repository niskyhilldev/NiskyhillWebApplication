    <div class="navbar">
        <div class="dropdown">
            <button>Owners</button>
            <div class="dropdown-content">

                <a href="search_owner.html">Search Owner</a>
            </div>
        </div>

        <div class="dropdown">
            <button>Residents</button>
            <div class="dropdown-content">

                <tr>
                    <td>A</td>

                </tr>
                <tr>
                    <td>B</td>
                    <td>No file available</td>
                </tr>
                <tr>
                    <td>C</td>
                    <td>No file available</td>
                </tr>
            </tbody>
        </table>
        <button onclick="showEditor()">Edit Sections</button>
        <button onclick="saveSections()">Save Changes</button>
