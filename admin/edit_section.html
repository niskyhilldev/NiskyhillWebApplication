<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Sections</title>
    <link rel="stylesheet" href="admin.css" />
    <script type="text/javascript" src="navbar.js" defer></script>
    <script type="text/javascript" src="admin.js" defer></script>
    <link rel="icon" type="image/x-icon" href="../img/logo.jpg">
    <script>
        function submitForm() {
            document.getElementById("addFileForm").reset();
        }
    </script>
</head>
<body>
    <custom-navbar></custom-navbar>
    <h1 style="text-align:center;">Edit a Section</h1>
    <div id="sectionEditor">
        <table>
            <thead>
                <tr>
                    <th>Section Name</th>
                    <th>Section Map</th>
                </tr>
            </thead>
            <tbody id="sectionTableBody">
                <tr>
                    <td>A</td>
                    <td>No file available</td>
                </tr>
                <tr>
                    <td>B</td>
                    <td>No file available</td>
                </tr>
                <tr>
                    <td>C</td>
                    <td>No file available</td>
                </tr>
            </tbody>
        </table>
        <button onclick="showEditor()">Edit Sections</button>
        <button onclick="saveSections()">Save Changes</button>
    </div>
</body>

<script>
window.addEventListener("load", function () {
    console.log("Fetching sections...");

    fetch('http://localhost:8080/sections/all')
        .then(response => response.json())
        .then(serverData => {
            let results = Object.values(serverData).filter(entry => {
                return true; // include all entries for now
            });
            console.log("Sections", results);

            const table = document.getElementById('sectionTableBody');
            table.innerHTML = ''; // Clear existing rows

            for (let i = 0; i < results.length; i++) {
                const row = document.createElement('tr');

                const nameCell = document.createElement('td');
                nameCell.textContent = results[i].name || 'N/A';
                row.appendChild(nameCell);

                const fileCell = document.createElement('td');
                fileCell.textContent = results[i].file || 'No file available';
                row.appendChild(fileCell);

                table.appendChild(row);
            }
        })
        .catch(error => {
            console.error("Error fetching sections:", error);
        });
});
</script>
</html>
