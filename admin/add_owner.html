<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add an Owner</title>
    <link rel="stylesheet" href="admin.css" />
    <link rel="stylesheet" href="form.css" />
    <script type="text/javascript" src="add_owner.js" defer></script>
    <script type="text/javascript" src="navbar.js" defer></script>
    <link rel="icon" type="image/x-icon" href="../img/logo.jpg">
</head>
<body>
    <custom-navbar></custom-navbar>
    <h1 style="text-align:center;">Add an Owner</h1>
    <div id="addOwnerForm">
        <form id="newOwnerForm">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName">
            
            <label for="middleName">Middle Name:</label>
            <input type="text" id="middleName">
            
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName">

            <label for="suffix">Suffix:</label>
            <input type="text" id="suffix">

            <label for="organization">Organization:</label>
            <input type="text" id="organization">
            
            <label for="lotNum">Lot Number*:</label>
            <input type="text" id="lotNum" required>
            
            <label for="portion">Lot Partition*:</label>
            <input type="text" id="portion" required>
            
            <label for="cemSection">Section*:</label>
            <input type="text" id="cemSection" required>
            
            <button type="submit">Add Entry</button>
        </form>
    </div>
</body>
