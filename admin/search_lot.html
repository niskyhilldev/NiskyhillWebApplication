<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lot Search</title>
    <link rel="stylesheet" href="admin.css" />
    <script type="text/javascript" src="navbar.js" defer></script>
    <script type="text/javascript" src="admin.js" defer></script>
    <link rel="icon" type="image/x-icon" href="../img/logo.jpg">
    <script>
        function submitForm() {
            document.getElementById("addFileForm").reset();
        }
    </script>
</head>
<body>
    <custom-navbar></custom-navbar>
    <h1 style="text-align:center;">Search for a Lot</h1>
    <div class="search-container">
        <label for="searchSectionPlots">Section:</label>
        <input type="text" id="searchSectionPlots" placeholder="Search section">
        <label for="searchLotPlots">Lot:</label>
        <input type="text" id="searchLotPlots" placeholder="Search lot">
        <button onclick="performPlotSearch()">Search</button>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Section Name</th>
                <th>Lot Number</th>
                <th>Lot Partition</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="plotTableBody">
            <!-- Table content will be dynamically populated -->
        </tbody>
    </table>
</body>
