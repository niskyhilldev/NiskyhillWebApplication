<!DOCTYPE html>
<html>
<head>
  <title>Nisky Hill Cemetery Map</title>
  <meta charset="utf-8" />
  <!-- Mobile viewport & safe-area support -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --header-h: 64px;
      --panel-w: 250px;
    }
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: #fff;
    }
    header {
      background-color: #f5f5f5;
      padding: 1rem;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .container {
      display: flex;
      flex-direction: row;
      gap: 20px;
      padding: 1rem;
      align-items: stretch;
    }
    #map {
      height: 70vh; /* mobile-friendly height */
      min-height: 420px;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    .info-panel {
      width: var(--panel-w);
      text-align: left;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #f9f9f9;
      flex-shrink: 0;
      height: fit-content;
    }
    .info-panel img {
      width: 100%;
      border-radius: 5px;
      display: none;
    }
    .search-container {
      margin-top: .75rem;
      position: relative; /* anchors suggestions dropdown */
    }
    .search-bar {
      width: 100%;
      padding: 12px; /* bigger tap target */
      font-size: 16px; /* prevent iOS zoom */
    }
    .search-button {
      padding: 12px 14px;
      font-size: 16px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      margin-top: 8px;
      width: 100%; /* easier on thumbs */
    }
    .suggestions {
      list-style: none;
      padding: 0;
      margin: 4px 0 0 0;
      background: white;
      border: 1px solid #ccc;
      max-height: 200px;
      overflow-y: auto;
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      z-index: 1000;
      border-radius: 6px;
    }
    .suggestions li {
      padding: 10px 12px;
      cursor: pointer;
    }
    .suggestions li:hover {
      background-color: #eee;
    }
    .leaflet-interactive.fade-in {
      animation: fadeIn 0.9s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    /* Stack on smaller screens */
    @media (max-width: 900px) {
      .container { flex-direction: column; }
      .info-panel { width: 100%; order: 3; }
      #map { order: 2; height: calc(100vh - var(--header-h) - 180px); }
    }
    /* Handle short/landscape viewports */
    @media (max-height: 520px) {
      #map { height: 60vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Nisky Hill Cemetery Interactive Map</h1>
  </header>
  <div class="container">
    <div style="flex: 1">
      <p>Nisky Hill Search Demo</p>
      <div class="search-container">
        <input type="text" id="grave-search" class="search-bar" placeholder="Search for a name..." oninput="updateSuggestions()" />
        <ul id="suggestions" class="suggestions"></ul>
        <button class="search-button" onclick="searchGrave()">Search</button>
      </div>
      <div id="map"></div>
    </div>
    <div class="info-panel" id="info-panel">
      <h2>Person Info</h2>
      <img id="grave-image" src="" alt="Grave Image" />
      <p id="grave-name">Search a name</p>
      <p id="grave-dates"></p>
    </div>
  </div>

    // Search logic
    const searchInput = document.getElementById("grave-search");
    const suggestionsList = document.getElementById("suggestions");

    function updateSuggestions() {
      const input = searchInput.value.toLowerCase();
      suggestionsList.innerHTML = "";
      suggestionsList.style.display = "none";

      if (input.length > 0) {
        Object.keys(graveLocations).forEach(name => {
          if (name.toLowerCase().includes(input)) {
            const li = document.createElement("li");
            li.textContent = `${name} (${graveLocations[name].dates})`;
            li.onclick = () => {
              searchInput.value = name;
              suggestionsList.style.display = "none";
              searchGrave();
            };
            suggestionsList.appendChild(li);
          }
        });

        if (suggestionsList.children.length > 0) {
          suggestionsList.style.display = "block";
        }
      }
    }

    function searchGrave() {
      let name = searchInput.value;
      let data = graveLocations[name];

      // Case-insensitive exact match
      if (!data) {
        const matchKey = Object.keys(graveLocations).find(
          k => k.toLowerCase() === name.toLowerCase()
        );
        if (matchKey) {
          name = matchKey;
          data = graveLocations[name];
        }
      }

      if (data) {
        // Remove existing markers
        for (const key in graveMarkers) map.removeLayer(graveMarkers[key]);

        // Remove all section routes and outlines
        [
          sectionLRoute, sectionLOutline, sectionFRoute, sectionFOutline,
          section4Route, section4Outline, sectionA1Route, sectionA1Outline,
          sectionA2Route, sectionA2Outline, sectionA3Route, sectionA3Outline,
          sectionA4Route, sectionA4Outline, sectionA5Route, sectionA5Outline,
          sectionA6Route, sectionA6Outline, sectionIRoute, sectionIOutline,
          sectionKOutline, sectionARoute, // ARoute isn't highlighted alone but safe to clear
          sectionEOutline, section1Outline, sectionOOutline, sectionDOutline,
          sectionGOutline, sectionD5Outline, sectionD6Outline, sectionCOutline,
          sectionBOutline, sectionAOutline, unionCemeteryOutline
        ].forEach(layer => {
          try { map.removeLayer(layer); } catch(e){}
        });

        // Add and open marker
        graveMarkers[name].addTo(map);
        map.setView(data.coords, map.getZoom());
        graveMarkers[name].openPopup();

        // Highlight route + outline per section
        function fadeIn(layer) {
          const el = layer.getElement();
          if (el) el.classList.add("fade-in");
        }

        if (data.section === "L") {
          sectionLRoute.addTo(map); sectionLOutline.addTo(map);
          fadeIn(sectionLRoute); fadeIn(sectionLOutline);
        }
        if (data.section === "F") {
          sectionFRoute.addTo(map); sectionFOutline.addTo(map);
          fadeIn(sectionFRoute); fadeIn(sectionFOutline);
        }
        if (data.section === "A1") {
          sectionA1Route.addTo(map); sectionA1Outline.addTo(map);
          fadeIn(sectionA1Route); fadeIn(sectionA1Outline);
        }
        if (data.section === "A2") {
          sectionA2Route.addTo(map); sectionA2Outline.addTo(map);
          fadeIn(sectionA2Route); fadeIn(sectionA2Outline);
        }
        if (data.section === "A3") {
          sectionA3Route.addTo(map); sectionA3Outline.addTo(map);
          fadeIn(sectionA3Route); fadeIn(sectionA3Outline);
        }
        if (data.section === "A4") {
          sectionA4Route.addTo(map); sectionA4Outline.addTo(map);
          fadeIn(sectionA4Route); fadeIn(sectionA4Outline);
        }
        if (data.section === "A5") {
          sectionA5Route.addTo(map); sectionA5Outline.addTo(map);
          fadeIn(sectionA5Route); fadeIn(sectionA5Outline);
        }
        if (data.section === "A6") {
          sectionA6Route.addTo(map); sectionA6Outline.addTo(map);
          fadeIn(sectionA6Route); fadeIn(sectionA6Outline);
        }
        if (data.section === "I") {
          sectionIRoute.addTo(map); sectionIOutline.addTo(map);
          fadeIn(sectionIRoute); fadeIn(sectionIOutline);
        }
        if (data.section === "4") {
          section4Route.addTo(map); section4Outline.addTo(map);
          fadeIn(section4Route); fadeIn(section4Outline);
        }

        // Update info panel
        document.getElementById("grave-image").src = data.image;
        document.getElementById("grave-image").style.display = "block";
        document.getElementById("grave-name").textContent = data.name;
        document.getElementById("grave-dates").textContent = data.dates;

        suggestionsList.style.display = "none";
        // Recompute map size after DOM changes (mobile)
        fixMapSizeSoon();
      } else {
        alert("Grave not found.");
        document.getElementById("grave-image").style.display = "none";
        document.getElementById("grave-name").textContent = "Search a name";
        document.getElementById("grave-dates").textContent = "";
      }
    }
